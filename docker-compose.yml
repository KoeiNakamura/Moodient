version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: moodient_db
    environment:
      POSTGRES_DB: moodient_db
      POSTGRES_USER: moodient_user
      POSTGRES_PASSWORD: moodient_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: moodient_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=moodient_db
      - DB_USER=moodient_user
      - DB_PASSWORD=moodient_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: moodient_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - WATCHPACK_POLLING=true
    tty: true

volumes:
  postgres_data: